name: 🐛 缺陷报告 (Bug Report)
description: 报告一个在 litmoss-form 中遇到的错误或异常行为
title: "Bug: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！为了快速定位问题，请务必提供详细的复现步骤。**信息不全的 Issue 可能会被暂时关闭**。
  - type: textarea
    id: description
    attributes:
      label: 问题描述 (Description)
      description: 请清晰、简洁地描述这个 Bug 是什么。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与最小复现链接 (Reproduction)
      description: 请提供能够稳定复现该问题的步骤。强烈建议提供一个 CodeSandbox、StackBlitz 或 GitHub 仓库的最小复现代码链接。
      placeholder: |
        1. 打开链接...
        2. 填写表单...
        3. 点击提交...
        4. 观察到报错...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 (Expected Behavior)
      description: 你期望发生什么？实际又发生了什么？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: litmoss-form 版本
      placeholder: 例如：v1.0.2
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 请提供浏览器版本、React 版本、以及是否使用了 TypeScript。
      placeholder: 例如：Chrome 120, React 18.2.0, TS 5.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志或截图 (Logs)
      description: 请粘贴相关的控制台报错信息，或上传截图。
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已经搜索了现有的 Issues，确认这不是一个重复的问题。
          required: true