name: "Chromatic"
on:
  push:
    branches: [ main ]   # 只在推送到 main 分支时触发

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须为 0，Chromatic 需要完整的 git 历史来对比基线

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 升级到 22 版本
          cache: 'npm'     # 开启 npm 缓存，加速后续构建

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # 可选：只在 main 分支时更新主 URL
          # autoAcceptChanges: main  # 如果是 main 分支，自动接受变更作为新基线